server:
  port: 8080

spring:
  application:
    name: ticketing-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketing_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-32-bytes}
  expiration: ${JWT_EXPIRATION:86400000}

