<main class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <span class="emoji">🎟️</span>
      <h1>Welcome Back</h1>
      <p>Enter your credentials to access your tickets</p>
    </div>

    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" formControlName="email" placeholder="user@example.com">
        <small class="error-text" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Valid email is required.
        </small>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" formControlName="password" placeholder="••••••••">
        <small class="error-text" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password must be at least 8 characters.
        </small>
      </div>
      <button class="btn btn-primary auth-btn" type="submit" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Register now</a></p>
    </div>
  </div>
</main>
