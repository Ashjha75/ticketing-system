<header class="navbar">
  <div class="logo">
    <span class="emoji">🎟️</span>
    <span class="brand-name">TicketHub</span>
  </div>
  <div class="nav-links">
    <button class="nav-btn" routerLink="/events">Events</button>
    <button class="nav-btn" routerLink="/bookings">My Bookings</button>
    <button class="nav-btn" routerLink="/profile">Profile</button>
    <button class="nav-btn" routerLink="/admin/dashboard">Admin</button>
    <button class="portfolio-btn" routerLink="/login">
      Sign In
    </button>
  </div>
</header>

<router-outlet></router-outlet>

<div class="toast-container" *ngIf="toast">
  <div class="toast" [ngClass]="toast.type">
    <div class="toast-content">
      <span class="toast-icon">
        <ng-container *ngIf="toast.type === 'success'">✅</ng-container>
        <ng-container *ngIf="toast.type === 'error'">🚨</ng-container>
        <ng-container *ngIf="toast.type === 'info'">ℹ️</ng-container>
      </span>
      <span class="toast-message">{{toast.message}}</span>
    </div>
    <button class="toast-close" (click)="closeToast()">×</button>
  </div>
</div>
